name: ICA Sorani preview browser acceptance (temporary)
on:
  pull_request:
    paths:
      - "app/src/lib/ica-i18n.ts"
      - "scripts/ica-browser-qa.cjs"
      - ".github/workflows/ica-sorani-preview-qa.yml"
permissions:
  contents: read
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser runtime
        run: npm install --no-save playwright@1.58.2
      - name: Exercise actual SSR and hydration for Sorani and all other language/device cases
        env:
          ICA_TEST_URL: https://ica-international-portal-9ytooem1u-hunarjabbar70-1239s-projects.vercel.app
        run: node scripts/ica-browser-qa.cjs
