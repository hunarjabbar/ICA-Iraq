name: ICA international production checks
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/ica-browser-qa.cjs"
      - ".github/workflows/ica-production-checks.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ica-production-checks.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Verify source files
        run: |
          test -f app/package.json
          test -f app/src/routes/__root.tsx
          test -f app/src/components/ica/studio.tsx
      - name: Verify live ICA routes and language shells
        env:
          ICA_URL: https://ica-international-portal.vercel.app
          CCC_URL: https://ccc-iraq-cultural-centre.vercel.app
        run: |
          python3 - <<'PY'
          import os,urllib.request,json
          ica=os.environ['ICA_URL']
          ccc=os.environ['CCC_URL']
          cases=[
            (ica+'/',b'IRAQI-CHINESE'),
            (ica+'/?lang=ar',b'lang="ar"'),
            (ica+'/?lang=ckb',b'lang="ckb"'),
            (ica+'/?lang=zh',b'lang="zh"'),
            (ica+'/desk/latest',b'<html'),
            (ica+'/newsroom',b'<html'),
            (ica+'/auth/reset',b'Recover your ICA account'),
            (ica+'/auth/verify',b'ICA email verification'),
            (ica+'/auth/update-password',b'Set a new password'),
            (ica+'/sitemap.xml',b'<urlset'),
            (ica+'/discover',b'<html'),
            (ica+'/discover/en',b'<html'),
            (ica+'/discover/ckb',b'lang="ckb"'),
            (ica+'/discover/account',b'<html'),
            (ica+'/news-sitemap.xml',b'<urlset'),
            (ica+'/monitor/status',b'public-http-liveness'),
            (ccc+'/ica',b'ICA'),
          ]
          for url,needle in cases:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ICA-CI-Health/1.0'}),timeout=25) as r:
              body=r.read()
              assert r.status==200,(url,r.status)
              assert needle in body,(url,'missing expected marker')
              assert b'Unable to load' not in body,(url,'server error fallback')
              print('PASS',url)
          # Regression gate: no native ICA page may publish a deleted canonical hosting origin.
          for path in ('/','/news','/desk/latest','/contact'):
            with urllib.request.urlopen(urllib.request.Request(ica+path,headers={'User-Agent':'ICA-CI-OriginGuard/1.0'}),timeout=25) as r:
              html=r.read().decode('utf-8')
              canonical='rel="canonical" href="https://ica-international-portal.vercel.app'+path+'"'
              assert canonical in html,(path,'canonical points away from native ICA')
              for deleted in ('ica-iraqi-chinese-agency.higgsfield.app','ica-publishing-experience.vercel.app','ica-account-security.vercel.app'):
                assert deleted not in html,(path,'deleted hosting provider leaked')
              print('PASS native canonical and deleted provider guard',path)
          with urllib.request.urlopen(ica+'/studio',timeout=25) as r:
            assert r.geturl().startswith('https://ccc-command-centre.vercel.app/'),r.geturl()
            assert r.status==200
            print('PASS legacy staff redirect -> Central Command Centre')
          with urllib.request.urlopen(ica+'/api/ica-wire?desk=latest',timeout=25) as r:
            j=json.load(r)
            assert r.status==200 and j.get('ok') and isinstance(j.get('items'),list),j
            print('PASS wire',len(j['items']))
          with urllib.request.urlopen(ica+'/api/ica-studio',timeout=25) as r:
            j=json.load(r)
            assert r.status==200 and j.get('retired') is True and j.get('configured') is False,j
            assert j.get('commandCentre')=='https://ccc-command-centre.vercel.app/signin'
            assert 'serviceRoleKey' not in j and 'blobToken' not in j
            print('PASS retired legacy editorial login')
          with urllib.request.urlopen(ica+'/api/ccc-editorial',timeout=25) as r:
            j=json.load(r)
            assert r.status==200 and j.get('ok') and isinstance(j.get('items'),list),j
            print('PASS public ICA-to-CCC editorial feed')
          from urllib.error import HTTPError
          def post(path,payload):
            req=urllib.request.Request(ica+path,data=json.dumps(payload).encode('utf-8'),headers={'Content-Type':'application/json','User-Agent':'ICA-CI-Health/1.0'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=25) as r: return r.status,json.load(r)
            except HTTPError as e: return e.code,json.loads(e.read())
          code,body=post('/api/ica',{'action':'contact','email':'not-an-email'})
          assert code==400 and body.get('ok') is False,(code,body)
          print('PASS contact validation rejects invalid email')
          code,body=post('/api/ica',{'action':'subscribe','email':'qa-smoke@example.invalid','website':'honeypot-no-write'})
          assert code==200 and body.get('ok') is True,(code,body)
          print('PASS form submission dry-run without storing user data')
          code,body=post('/api/ica-studio',{'action':'login','key':'legacy-test'})
          assert code==410 and body.get('retired') is True,(code,body)
          print('PASS legacy editor-key login retired')
          code,body=post('/api/ica-upload',{'file':'not-uploaded'})
          assert code==410 and body.get('retired') is True,(code,body)
          print('PASS legacy upload endpoint retired')
          PY

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.58.2
          node --version
      - name: Verify browser hydration, RTL layout and editorial login
        run: node scripts/ica-browser-qa.cjs
