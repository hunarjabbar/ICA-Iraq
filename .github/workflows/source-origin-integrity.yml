name: ICA source origin integrity
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-source-origins.cjs
