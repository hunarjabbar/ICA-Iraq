name: ICA current-source visual verification
on:
  pull_request:
    paths:
      - "app/src/styles.css"
      - "app/src/components/ica/**"
      - "app/tests/**"
      - "scripts/ica-v24-preview-qa.cjs"
      - ".github/workflows/ica-v24-preview-qa.yml"
permissions:
  contents: read
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Bun archive prerequisite
        run: apt-get update -qq && apt-get install -y unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install and build checked-out source
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install matching Playwright runtime
        run: npm install --no-save playwright@1.58.2
      - name: Test current build with responsive menus, RTL and reduced motion
        env:
          ICA_TEST_URL: http://127.0.0.1:4173
        run: |
          cd app
          bun run preview --host 0.0.0.0 --port 4173 > /tmp/ica-preview.log 2>&1 &
          cd ..
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 2
          done
          node scripts/ica-v24-preview-qa.cjs
