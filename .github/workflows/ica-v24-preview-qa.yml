name: ICA current-source visual verification
on:
  pull_request:
    paths:
      - "app/src/styles.css"
      - "app/src/components/ica/**"
      - "app/tests/**"
      - "scripts/ica-v24-preview-qa.cjs"
      - ".github/workflows/ica-v24-preview-qa.yml"
permissions:
  contents: read
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Bun archive prerequisite
        run: apt-get update -qq && apt-get install -y unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install and build checked-out source
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install matching Playwright runtime
        run: npm install --no-save playwright@1.58.2
      # Vite's local preview is not a Vercel/TanStack production runtime for
      # this Cloudflare-aware SSR app; it serves 500 without platform bindings.
      # The pinned immutable deployment below was built from the app sources
      # at this commit. Fail closed if new app sources are not yet deployed.
      - name: Verify browser target matches checked-out application source
        run: git diff --quiet 2960508db56045daf73c26785085c264d140577a HEAD -- app/src app/public app/package.json app/bun.lock
      - name: Test verified Vercel preview with responsive menus, RTL and reduced motion
        env:
          ICA_TEST_URL: https://ica-international-portal-6do0txvdy-hunarjabbar70-1239s-projects.vercel.app
        run: |
          for attempt in $(seq 1 6); do
            if curl -fsS "${ICA_TEST_URL}/" > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS "${ICA_TEST_URL}/" > /dev/null
          node scripts/ica-v24-preview-qa.cjs
