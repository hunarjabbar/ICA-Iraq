name: ICA current-source visual verification
on:
  pull_request:
    paths:
      - "app/src/styles.css"
      - "app/src/components/ica/**"
      - "app/tests/**"
      - "scripts/ica-v24-preview-qa.cjs"
      - ".github/workflows/ica-v24-preview-qa.yml"
permissions:
  contents: read
  deployments: read
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Bun archive prerequisite
        run: apt-get update -qq && apt-get install -y unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install and build checked-out source
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install matching Playwright runtime
        run: npm install --no-save playwright@1.58.2
      # This is source browser smoke coverage, not a deployed Vercel runtime.
      # Keep the separate immutable Vercel release-manifest gate below.
      - name: Verify ICA candidate UI against checked-out local dev runtime
        env:
          ICA_TEST_URL: http://127.0.0.1:4173
        run: |
          set -eu
          (cd app && bun run dev --host 127.0.0.1 --port 4173 --strictPort > /tmp/ica-source-v27.log 2>&1) &
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null 2>&1; then break; fi
            sleep 2
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
            cat /tmp/ica-source-v27.log
            exit 1
          fi
          node scripts/ica-v24-preview-qa.cjs
      # Vite's local preview cannot replace this Cloudflare-aware SSR deployment.
      # Only certify a Vercel preview whose public release manifest matches
      # the PR source SHA; never pin an older preview URL or stylesheet blob.
      - name: Find and certify immutable Vercel candidate for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          ICA_CANDIDATE_PREVIEW_URL: ${{ vars.ICA_CANDIDATE_PREVIEW_URL }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          repo=os.environ['GH_REPOSITORY']
          sha=os.environ['EXPECTED_SHA']
          token=os.environ.get('GH_TOKEN','')
          candidates=[]
          override=os.environ.get('ICA_CANDIDATE_PREVIEW_URL','').strip()
          if override: candidates.append(override)
          def github_json(url):
              headers={'User-Agent':'ICA-Release-Gate/1.0','Accept':'application/vnd.github+json'}
              if token: headers['Authorization']='Bearer '+token
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as response:
                  return json.load(response)
          try:
              base='https://api.github.com/repos/'+repo
              for deployment in github_json(base+'/deployments?sha='+sha+'&per_page=40'):
                  for status in github_json(base+'/deployments/'+str(deployment['id'])+'/statuses?per_page=15'):
                      if status.get('state')=='success':
                          candidates.extend([status.get('environment_url',''),status.get('target_url','')])
          except Exception as exc:
              print('GitHub deployment-status discovery unavailable:',str(exc)[:180])
          seen=set()
          for candidate in candidates:
              candidate=candidate.strip().rstrip('/')
              if candidate in seen: continue
              seen.add(candidate)
              parsed=urllib.parse.urlparse(candidate)
              if parsed.scheme!='https' or not (parsed.hostname or '').endswith('.vercel.app') or parsed.username or parsed.password:
                  continue
              if parsed.path not in ('','/'): continue
              try:
                  req=urllib.request.Request(candidate+'/release.json',headers={'User-Agent':'ICA-Release-Gate/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      release=json.load(response)
                  if release.get('project')!='ica' or release.get('commit')!=sha:
                      print('Rejecting stale ICA preview: release manifest does not match PR commit')
                      continue
                  with open(os.environ['GITHUB_ENV'],'a') as env:
                      env.write('ICA_TEST_URL='+candidate+'\n')
                  print('Verified exact ICA preview candidate:',candidate,'commit:',sha)
                  break
              except Exception as exc:
                  print('Preview candidate not yet verifiable:',str(exc)[:160])
          else:
              raise SystemExit('No Vercel preview with ICA release.json matching the PR SHA; '
                               'wait for preview capacity or set ICA_CANDIDATE_PREVIEW_URL '
                               'to a preview of this commit. Production is not certified.')
          PY
      - name: Test matching Vercel preview with responsive menus, RTL and reduced motion
        run: |
          curl --fail --silent --show-error "${ICA_TEST_URL}/" > /dev/null
          node scripts/ica-v24-preview-qa.cjs
          node scripts/ica-browser-qa.cjs
