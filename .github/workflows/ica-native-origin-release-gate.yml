name: ICA native origin and single-console release gate
on:
  pull_request:
    paths:
      - 'scripts/ica-native-origin-smoke.cjs'
      - 'tests/ica-native-origin-smoke.test.cjs'
      - '.github/workflows/ica-native-origin-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ica-native-origin-smoke.cjs'
      - 'tests/ica-native-origin-smoke.test.cjs'
      - '.github/workflows/ica-native-origin-release-gate.yml'
      - 'app/src/routes/**'
      - 'app/src/lib/ica-i18n.ts'
  workflow_dispatch:
  schedule:
    - cron: '11 6 * * *'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify no-credential source and origin test
        run: node --test tests/ica-native-origin-smoke.test.cjs
  live-production:
    if: github.event_name != 'pull_request'
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # A red gate is intentional while production still serves an older source SHA.
      # Do not downgrade this check or falsely report a preview as current production.
      - name: Verify canonical URLs, first-party monitoring and centralized staff route
        run: node scripts/ica-native-origin-smoke.cjs
